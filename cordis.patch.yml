# dsh-railist bundle for DeepSeek Harness.
# Inserted into the profile's composition when this bundle is installed
# (`dsh plugin --profile web add link:/path/to/dsh-railist`). The row resolves the
# package by name through the profile's node_modules; the node half stores the
# configuration and serves the loopback route, the dshClient half rewrites the
# rail registrations and owns the Settings tab.
- insert:
    - id: railist
      name: dsh-railist
